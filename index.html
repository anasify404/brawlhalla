<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brawlhallah Roaster</title>
    <link
      rel="shortcut icon"
      href="https://i.pinimg.com/736x/73/5d/28/735d2817dad034b3c6fbac02f5cbc03e.jpg"
      type="image/x-icon"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <nav>
        <h1 class="logo">BH <span>ROASTER</span></h1>
        <ul>
          <li>
            <!-- <a href="#"><button class="secondary">xyz</button></a> -->
          </li>
          <li>
            <a href="https://github.com/theanasify" target="_blank"
              ><button class="primary">@theanasify</button></a
            >
          </li>
        </ul>
      </nav>
    </header>
    <main>
      <div class="heroSection" id="heroSection">
        <h2>Enter Player Id</h2>
        <form class="input" id="input">
          <input
            class="inputId"
            id="inputId"
            minlength="4"
            maxlength="15"
            type="text"
            inputmode="numeric"
            pattern="[0-9]*"
            placeholder="e.g. 137xxx39"
            required
          />
          <!-- <div> -->
          <button class="primary" type="submit">Search</button>
          <!-- <button class="secondary">AI Roast</button> -->
          <h3>(AI Roaster Soon...🔥)</h3>
          <!-- </div> -->
        </form>
      </div>

      <div id="playerNotFound" class="toggle playerNotFound">
        <p><span>404</span></p>
        <p>Player Not Found</p>
      </div>

      <div id="playerIdSection" class="playerIdSection"></div>

      <div class="playerTopLegends" id="playerTopLegends"></div>

      <div class="instructions"></div>
    </main>
    <script src="scripts.js"></script>
  </body>
</html>
