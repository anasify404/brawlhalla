<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brawlhallah Roaster</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <nav>
        <h1 class="logo">BH <span>ROASTER</span></h1>
        <ul>
          <li>
            <!-- <a href="#"><button class="secondary">xyz</button></a> -->
          </li>
          <li>
            <a href="https://github.com/theanasify" target="_blank"
              ><button class="primary">@theanasify</button></a
            >
          </li>
        </ul>
      </nav>
    </header>
    <main>
      <div class="heroSection" id="heroSection">
        <h2>Enter Player Id</h2>
        <form class="input" id="input">
          <input
            class="inputId"
            id="inputId"
            minlength="4"
            maxlength="15"
            type="text"
            inputmode="numeric"
            pattern="[0-9]*"
            placeholder="e.g. 137xxx39"
          />
          <!-- <div> -->
          <button class="primary" type="submit">Search</button>
          <!-- <button class="secondary">AI Roast🔥</button> -->
          <!-- </div> -->
        </form>
      </div>

      <div id="playerNotFound" class="playerNotFound toggle">
        <p>404</p>
        <p>Player Not Found</p>
      </div>
      <div
        id="playerHeading"
        class="toggle"
        style="
          display: flex;
          align-items: center;
          justify-content: center;
          margin: 10px;
        "
      >
        <h2>Player Stats:</h2>
      </div>

      <div id="playerIdSection" class="playerIdSection"></div>
      <div
        id="legendHeading"
        class="toggle"
        style="
          display: flex;
          align-items: center;
          justify-content: center;
          margin-top: 10px;
        "
      >
        <h2>Top 5 Legends</h2>
      </div>
      <div class="playerTopLegends" id="playerTopLegends"></div>
    </main>
    <script src="scripts.js"></script>
  </body>
</html>
